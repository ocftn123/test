/* =====================================================
   4. 유틸리티
===================================================== */

function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
        [array[j], array[i]];
    }

    return array;
}


function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}


/* =====================================================
   5. 문제 생성
===================================================== */

function makeQuestions() {

    let questions = [];

    vocabulary.forEach((item) => {

        const word = item.word;
        const meaning = item.meaning;


        /* ---------------------------------------------
           TYPE 1
           영어 → 한국어
        --------------------------------------------- */

        let meaningChoices =
            vocabulary
            .filter(x => x.word !== word)
            .map(x => x.meaning);

        shuffle(meaningChoices);

        let choices1 =
            [meaning, ...meaningChoices.slice(0, 4)];

        shuffle(choices1);

        questions.push({

            type: "EN-KO",

            word: word,

            prompt: word,

            choices: choices1,

            answer: meaning

        });


        /* ---------------------------------------------
           TYPE 2
           한국어 → 영어
        --------------------------------------------- */

        let wordChoices =
            vocabulary
            .filter(x => x.word !== word)
            .map(x => x.word);

        shuffle(wordChoices);

        let choices2 =
            [word, ...wordChoices.slice(0, 4)];

        shuffle(choices2);

        questions.push({

            type: "KO-EN",

            word: word,

            prompt: meaning,

            choices: choices2,

            answer: word

        });


        /* ---------------------------------------------
           TYPE 3
           CLOZE
        --------------------------------------------- */

        let clozeChoices =
            vocabulary
            .filter(x => x.word !== word)
            .map(x => x.word);

        shuffle(clozeChoices);

        let choices3 =
            [word, ...clozeChoices.slice(0, 4)];

        shuffle(choices3);

        questions.push({

            type: "CLOZE",

            word: word,

            prompt: contexts[word],

            choices: choices3,

            answer: word

        });


        /* ---------------------------------------------
           TYPE 4
           의미 관계
        --------------------------------------------- */

        const relation =
            relations[word];

        let choices4 =
            [...relation[1]];

        shuffle(choices4);

        questions.push({

            type: "RELATION",

            word: word,

            prompt: relation[0],

            choices: choices4,

            answer: relation[2]

        });

    });


    return questions;
}


/* =====================================================
   6. 문제 렌더링
===================================================== */

let questions =
    makeQuestions();


const typeNames = {

    "EN-KO":
    "영어 → 한국어",

    "KO-EN":
    "한국어 → 영어",

    "CLOZE":
    "Cloze / 문맥형",

    "RELATION":
    "유의어·반의어 / 의미 관계"

};


function renderQuestions() {

    const quiz =
        document.getElementById("quiz");

    quiz.innerHTML = "";


    questions.forEach((question, index) => {

        const div =
            document.createElement("div");

        div.className =
            "question";


        let choicesHTML = "";


        question.choices.forEach(
            (choice, choiceIndex) => {

                const letter =
                    String.fromCharCode(
                        65 + choiceIndex
                    );

                choicesHTML += `

                    <label class="choice">

                        <input
                            type="radio"
                            name="question-${index}"
                            value="${escapeHTML(choice)}"
                        >

                        ${letter}. ${escapeHTML(choice)}

                    </label>
                `;
            }
        );


        div.innerHTML = `

            <div class="question-number">

                Q${index + 1}

                <span class="type">
                    ${typeNames[question.type]}
                </span>

            </div>


            <div class="prompt">

                ${escapeHTML(question.prompt)}

            </div>


            ${choicesHTML}


            <div class="answer"></div>

        `;


        quiz.appendChild(div);

    });

}


/* =====================================================
   7. 전체 문제 순서 섞기
===================================================== */

function shuffleQuestions() {

    shuffle(questions);

    renderQuestions();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   8. 채점
===================================================== */

function grade() {

    const questionDivs =
        document.querySelectorAll(".question");


    let score = 0;

    let unanswered = 0;


    questionDivs.forEach(
        (div, index) => {

            const question =
                questions[index];


            const selected =
                div.querySelector(
                    "input:checked"
                );


            const choices =
                div.querySelectorAll(
                    ".choice"
                );


            choices.forEach(
                choice => {

                    choice.classList.remove(
                        "correct",
                        "wrong"
                    );

                }
            );


            if (!selected) {

                unanswered++;

            }

            else if (
                selected.value ===
                question.answer
            ) {

                score++;

                selected
                    .parentElement
                    .classList.add(
                        "correct"
                    );

            }

            else {

                selected
                    .parentElement
                    .classList.add(
                        "wrong"
                    );

            }


            /* 정답 표시 */

            choices.forEach(
                choice => {

                    const input =
                        choice.querySelector(
                            "input"
                        );


                    if (
                        input.value ===
                        question.answer
                    ) {

                        choice.classList.add(
                            "correct"
                        );

                    }

                }
            );


            const answerBox =
                div.querySelector(
                    ".answer"
                );


            answerBox.style.display =
                "block";


            answerBox.innerHTML =

                `정답:
                <strong>
                    ${escapeHTML(question.answer)}
                </strong>
                <br>
                단어:
                <strong>
                    ${escapeHTML(question.word)}
                </strong>`;

        }
    );


    const total =
        questionDivs.length;


    const percentage =
        Math.round(
            score / total * 100
        );


    const result =
        document.getElementById(
            "result"
        );


    result.innerHTML = `

        <strong>
            ${score} / ${total}
            (${percentage}점)
        </strong>

        <br>

        미응답:
        ${unanswered}개

    `;


    result.style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   9. 처음부터
===================================================== */

function resetTest() {

    questions =

/* =====================================================
   10. 최초 실행
===================================================== */
